name: Build

on:
  push:
    branches-ignore:
      - master

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      ##################################################################################################################
      # Clone
      ##################################################################################################################
      - name: Clone
        uses: actions/checkout@v2

      ##################################################################################################################
      # Setup
      ##################################################################################################################
      - name: Setup JavaScript
        uses: actions/setup-node@v2
        with:
          node-version: '12'

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'

      # Workaround until Act fix
      - name: Setup Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: 3.8.2

      ##################################################################################################################
      # Restore Cache
      ##################################################################################################################
      - name: Restore JavaScript Cache
        uses: actions/cache@v2
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Restore Java cache
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      ##################################################################################################################
      # Build
      ##################################################################################################################
      - name: Yarn install
        run: yarn

      - name: Yarn TypeScript compile
        run: yarn tsc

      - name: Yarn build
        run: yarn build

      - name: Maven package
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_REPO }}
        run: mvn package

      ##################################################################################################################
      # Setup OpenShift
      ##################################################################################################################
      - name: Setup OC CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Setup OpenShift context
        uses: redhat-actions/oc-login@v1
        env:
          OPENSHIFT_USERNAME: ${{ secrets.OPENSHIFT_USERNAME }}
          OPENSHIFT_PASSWORD: ${{ secrets.OPENSHIFT_PASSWORD }}
        with:
          openshift_server_url: https://api.crc.testing:6443
          openshift_username: ${{ OPENSHIFT_USERNAME }}
          openshift_password: ${{ OPENSHIFT_PASSWORD }}
          insecure_skip_tls_verify: true

      - name: Setup certificates
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates

      - name: Setup Helmfile
        uses: mamezou-tech/setup-helmfile@v0.8.0

      ##################################################################################################################
      # Install Infra
      ##################################################################################################################
      - name: Helmfile sync
        run: helmfile sync
