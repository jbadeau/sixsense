---
bases:
  - "../../bases/helmDefaults.yaml"
  - "../../bases/environments.yaml"

---
repositories:
  - name: strimzi
    url: https://strimzi.io/charts
  - name: spark-operator
    url: https://googlecloudplatform.github.io/spark-on-k8s-operator
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: kafka-operator
    namespace: sixsense-dev
    chart: strimzi/strimzi-kafka-operator
    version: 0.24.0
    labels:
      bootstrap: true
      tier: bootstrap
    values:
      - kafka.operator.values.yaml.gotmpl

  - name: spark-operator
    namespace: sixsense-dev
    chart: spark-operator/spark-operator
    version: 1.1.3
    labels:
      bootstrap: true
      tier: bootstrap
    values:
      - spark.operator.values.yaml.gotmpl