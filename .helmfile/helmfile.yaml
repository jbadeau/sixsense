# Chart repositories used from within this state file
#
# Use `helm-s3` and `helm-git` and whatever Helm Downloader plugins
# to use repositories other than the official repository or one backend by chartmuseum.
repositories:
  # To use official "stable" charts a.k.a https://github.com/helm/charts/tree/master/stable
  - name: stable
    url: https://charts.helm.sh/stable
  - name: incubator
    url: https://charts.helm.sh/incubator
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: influxdata
    url: https://helm.influxdata.com
  - name: kafka-ui
    url: https://provectus.github.io/kafka-ui
  - name: spark-operator
    url: https://googlecloudplatform.github.io/spark-on-k8s-operator

helmDefaults:
  wait: true

releases:
  # minio
  - name: minio
    namespace: sixsense-dev
    chart: bitnami/minio
    values:
      - values/dev/minio/values.yaml

  # spark
  - name: spark-operator
    namespace: sixsense-dev
    chart: spark-operator/spark-operator
    needs:
      - sixsense-dev/sparc-rbac
    values:
      - values/dev/spark-operator/values.yaml

  # kafka
  - name: kafka
    namespace: sixsense-dev
    chart: bitnami/kafka
    values:
      - values/dev/kafka/values.yaml
  - name: cp-schema-registry
    namespace: sixsense-dev
    chart: ../charts/cp-schema-registry
    needs:
      - sixsense-dev/kafka
    values:
      - values/dev/cp-schema-registry/values.yaml
  - name: kafka-ui
    namespace: sixsense-dev
    chart: kafka-ui/kafka-ui
    needs:
      - sixsense-dev/kafka
    values:
      - values/dev/kafka-ui/values.yaml

  # camel
  - name: camel-jira-kafka-connector
    namespace: sixsense-dev
    chart: ../modules/camel-jira-kafka-connector/.helm
    needs:
      - sixsense-dev/cp-schema-registry
      - sixsense-dev/kafka
    values:
      - values/dev/camel-jira-kafka-connector/values.yaml

  # influx
  - name: influxdb
    namespace: sixsense-dev
    chart: bitnami/influxdb
    values:
      - values/dev/influxdb/values.yaml
  - name: telegraf
    namespace: sixsense-dev
    chart: influxdata/telegraf
    needs:
      - sixsense-dev/influxdb
    values:
      - values/dev/telegraf/values.yaml

  # backstage
  - name: backstage
    namespace: sixsense-dev
    chart: ../charts/backstage
    values:
      - values/dev/backstage/values.yaml

  # pipeline
  - name: pipeline-jira
    namespace: sixsense-dev
    chart: ../modules/pipeline-jira/.helm
    needs:
      - sixsense-dev/kafka
      - sixsense-dev/spark-operator
      - sixsense-dev/influxdb
      - sixsense-dev/camel-jira-kafka-connector
    values:
      - values/dev/pipeline-jira/values.yaml