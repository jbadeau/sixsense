repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: influxdata
    url: https://helm.influxdata.com
  - name: kafka-ui
    url: https://provectus.github.io/kafka-ui
  - name: spark-operator
    url: https://googlecloudplatform.github.io/spark-on-k8s-operator

releases:

  # influx
  - name: influxdb
    namespace: sixsense-dev
    chart: bitnami/influxdb
    version: 2.2.9
    values:
      - values/dev/influxdb/values.yaml

  # backstage
  - name: backstage
    namespace: sixsense-dev
    chart: ../charts/backstage
    version: 0.0.0
    values:
      - values/dev/backstage/values.yaml