# Chart repositories used from within this state file
#
# Use `helm-s3` and `helm-git` and whatever Helm Downloader plugins
# to use repositories other than the official repository or one backend by chartmuseum.
repositories:
  # To use official "stable" charts a.k.a https://github.com/helm/charts/tree/master/stable
  - name: stable
    url: https://charts.helm.sh/stable
  - name: incubator
    url: https://charts.helm.sh/incubator
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: influxdata
    url: https://helm.influxdata.com
  - name: minio
    url: https://operator.min.io
  - name: kafka-ui
    url: https://provectus.github.io/kafka-ui

releases:
  # delta lake
  - name: minio
    namespace: sixsense-dev
    chart: bitnami/minio
    values:
      - values/dev/minio/values.yaml
  - name: spark
    namespace: sixsense-dev
    chart: bitnami/spark
    values:
      - values/dev/spark/values.yaml

  # confluent
  - name: cp-schema-registry
    namespace: sixsense-dev
    chart: ../charts/cp-schema-registry
    values:
      - values/dev/cp-schema-registry/values.yaml
  - name: kafka
    namespace: sixsense-dev
    chart: bitnami/kafka
    values:
      - values/dev/kafka/values.yaml
  - name: kafka-ui
    namespace: sixsense-dev
    chart: kafka-ui/kafka-ui
    values:
      - values/dev/kafka-ui/values.yaml
  - name: kafka-connect-jira
    namespace: sixsense-dev
    chart: ../modules/kafka-connect-jira/.helm
    needs:
      - sixsense-dev/cp-schema-registry
    values:
      - values/dev/kafka-connect-jira/values.yaml

  # influx
  - name: influxdb
    namespace: sixsense-dev
    chart: bitnami/influxdb
    values:
      - values/dev/influxdb/values.yaml
  - name: telegraf
    namespace: sixsense-dev
    chart: influxdata/telegraf
    values:
      - values/dev/telegraf/values.yaml

  # backstage
  - name: backstage
    namespace: sixsense-dev
    chart: ../charts/backstage
    values:
      - values/dev/backstage/values.yaml

  # workflows
  - name: jira-oslc
    namespace: sixsense-dev
    chart: ../modules/jira-oslc/.helm
    needs:
      - sixsense-dev/cp-schema-registry
    values:
      - values/dev/jira-oslc/values.yaml