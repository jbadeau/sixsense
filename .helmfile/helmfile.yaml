# Chart repositories used from within this state file
#
# Use `helm-s3` and `helm-git` and whatever Helm Downloader plugins
# to use repositories other than the official repository or one backend by chartmuseum.
repositories:
  # To use official "stable" charts a.k.a https://github.com/helm/charts/tree/master/stable
  - name: stable
    url: https://charts.helm.sh/stable
  - name: incubator
    url: https://charts.helm.sh/incubator
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: influxdata
    url: https://helm.influxdata.com
  - name: kafka-ui
    url: https://provectus.github.io/kafka-ui
  - name: spark-operator
    url: https://googlecloudplatform.github.io/spark-on-k8s-operator

releases:

  # operators
  - name: spark-operator
    namespace: sixsense-dev
    chart: spark-operator/spark-operator
    wait: true
    values:
      - values/dev/spark-operator/values.yaml

  - name: strimzi-kafka-operator
    namespace: sixsense-dev
    chart: strimzi/strimzi-kafka-operator
    wait: true
    values:
      - values/dev/strimzi-kafka-operator/values.yaml

  # minio
  - name: minio
    namespace: sixsense-dev
    chart: bitnami/minio
    values:
      - values/dev/minio/values.yaml

  # kafka
  - name: kafka-cluster
    namespace: sixsense-dev
    chart: ../charts/kafka-cluster
    needs:
      - sixsense-dev/strimzi-kafka-operator
    wait: true
    values:
      - values/dev/kafka-cluster/values.yaml

  - name: cp-schema-registry
    namespace: sixsense-dev
    chart: ../charts/cp-schema-registry
    wait: true
    needs:
      - sixsense-dev/kafka-cluster
    values:
      - values/dev/cp-schema-registry/values.yaml

  - name: kafka-ui
    namespace: sixsense-dev
    chart: kafka-ui/kafka-ui
    values:
      - values/dev/kafka-ui/values.yaml


  # kafka connectors
  - name: kafka-connector
    namespace: sixsense-dev
    chart: ../charts/kafka-connector
    wait: true
    needs:
      - sixsense-dev/cp-schema-registry
    values:
      - values/dev/kafka-connector/values.yaml

