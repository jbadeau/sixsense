apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: jira-oslc
  namespace: sixsense-dev
spec:
  type: Java
  mode: cluster
  image: "tomassatka/spark-job-jira:0.0.20"
  imagePullPolicy: Always
  mainClass: com.sixgroup.sixsense.jira.oslc.JiraIssueToOslcChangeRequest
  mainApplicationFile: "local:///jobs/jira-oslc-0.0.0-SNAPSHOT.jar"
  deps:
    repositories:
      - https://packages.confluent.io/maven
    packages:
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.1.2
      - org.apache.spark:spark-core_2.12:3.1.2
      - org.apache.spark:spark-sql_2.12:3.1.2
      - org.apache.spark:spark-catalyst_2.12:3.1.2
      - org.apache.spark:spark-streaming_2.12:3.1.2
      - org.apache.spark:spark-avro_2.12:3.1.2
      - za.co.absa:abris_2.12:4.2.0
      - com.fasterxml.jackson.core:jackson-databind:2.10.0
      - com.fasterxml.jackson.core:jackson-annotations:2.10.0
  sparkVersion: "3.1.1"
  restartPolicy:
    type: Never
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.1.1
    serviceAccount: spark
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 3.1.1
    env:
      - name: KAFKA_JIRA_ISSUE_TOPIC
        value: jira-topic-issues
      - name: KAFKA_OSLC_CHANGE_REQUEST_TOPIC
        value: oslc-topic-changerequests
      - name: KAFKA_GROUP_ID
        value: "jira"
      - name: BOOTSTRAP_SERVER
        value: "kafka:9092"
      - name: CHECKPOINT_LOCATION
        value: "/checkpoint"
      - name: SCHEMA_REGISTRY_URL
        value: "http://cp-schema-registry:8081"