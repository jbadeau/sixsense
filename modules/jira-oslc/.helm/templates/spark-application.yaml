apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: jira-oslc
  namespace: sixsense-dev
spec:
  type: Java
  mode: cluster
  image: "tomassatka/spark-job-jira:0.0.23"
  imagePullPolicy: Always
  mainClass: com.sixgroup.sixsense.jira.oslc.JiraIssueToOslcChangeRequest
  mainApplicationFile: "local:///jobs/jira-oslc.jar"
  sparkVersion: "3.1.1"
  restartPolicy:
    type: Never
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.1.1
    serviceAccount: spark
    envVars:
      KAFKA_JIRA_ISSUE_TOPIC: {{ .Values.driver.env.KAFKA_JIRA_ISSUE_TOPIC }}
      KAFKA_OSLC_CHANGE_REQUEST_TOPIC: {{ .Values.driver.env.KAFKA_OSLC_CHANGE_REQUEST_TOPIC }}
      KAFKA_GROUP_ID: {{ .Values.driver.env.KAFKA_GROUP_ID}}
      BOOTSTRAP_SERVER: {{ .Values.driver.env.BOOTSTRAP_SERVER }}
      CHECKPOINT_LOCATION: {{ .Values.driver.env.CHECKPOINT_LOCATION }}
      SCHEMA_REGISTRY_URL: {{ .Values.driver.env.SCHEMA_REGISTRY_URL }}
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 3.1.1