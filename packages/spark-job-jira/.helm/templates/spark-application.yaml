apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-pipeline-jira-issues-waste
  namespace: sixsense-dev
spec:
  type: Java
  mode: cluster
  image: {{.Values.image.repository}}
  imagePullPolicy: {{.Values.image.pullPolicy}}
  mainClass: com.sixgroup.sixsense.pipeline.jira.issue.JiraIssuesWastePipeline
  mainApplicationFile: "local:///jobs/spark-job-jira.jar"
  sparkVersion: "3.1.1"
  restartPolicy:
    type: Never
  volumes:
    - name: checkpoint
      emptyDir: {}
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.1.1
    serviceAccount: spark
    envVars:
      MINIO_BUCKET: {{ .Values.driver.env.MINIO_BUCKET }}
      SCHEMA_REGISTRY_URL: {{ .Values.driver.env.SCHEMA_REGISTRY_URL }}
      KAFKA_BOOTSTRAP_SERVER: {{ .Values.driver.env.KAFKA_BOOTSTRAP_SERVER }}
      KAFKA_TOPIC_SOURCE_JIRA_ISSUES: {{ .Values.driver.env.KAFKA_TOPIC_SOURCE_JIRA_ISSUES }}
      KAFKA_GROUP_ID: {{ .Values.driver.env.KAFKA_GROUP_ID}}
      SPARK_CHECKPOINT_LOCATION: {{ .Values.driver.env.SPARK_CHECKPOINT_LOCATION }}
      DELTA_TABLE_JIRA_ISSUE_BRONZE: {{ .Values.driver.env.DELTA_TABLE_JIRA_ISSUE_BRONZE }}
      DELTA_TABLE_JIRA_ISSUE_SILVER: {{ .Values.driver.env.DELTA_TABLE_JIRA_ISSUE_SILVER }}
      KAFKA_TOPIC_JIRA_ISSUES: {{ .Values.driver.env.KAFKA_TOPIC_JIRA_ISSUES }}
    envSecretKeyRefs:
      MINIO_ACCESS_KEY:
        name: minio
        key: access-key
      MINIO_SECRET_KEY:
        name: minio
        key: secret-key
    volumeMounts:
      - name: minio
        mountPath: /checkpoint
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 3.1.1