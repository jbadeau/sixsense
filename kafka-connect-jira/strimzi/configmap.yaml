apiVersion: v1
kind: ConfigMap
metadata:
  name: jira-source-connect
data:
  config.properties: |
    name=jira-source
    tasks.max=1
    connector.class=io.confluent.connect.jira.JiraSourceConnector
    confluent.topic.bootstrap.servers=kafka-cluster-kafka-bootstrap:9092
    confluent.topic.replication.factor=1
  
    topic.name.pattern=jira-topic-${entityName}
    jira.tables=project_categories,projects,issue_comments,changelogs,issue_transitions,resolutions,project_types,issues,users,versions,worklogs
    jira.url=https://six-group.atlassian.net
    jira.since=2021-1-1 23:50
    jira.username=satka.tomas@gmail.com
    jira.api.token=gMjFBXO1vS6iv1lNVekPB610
  
    errors.log.enable=true
    errors.log.include.messages=true
    
    key.converter=io.confluent.connect.avro.AvroConverter
    key.converter.schema.registry.url=http://localhost:8081
    value.converter=io.confluent.connect.avro.AvroConverter
    value.converter.schema.registry.url=http://localhost:8081
